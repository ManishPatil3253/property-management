spring.application.name=property-management
server.port=8082

pms.dummy = This is a dummy for local environment

# Allow H2 DB to be accessed via browser and via Java application
spring.h2.console.enabled=true

# Database server path
spring.h2.console.path=/h2-console

# DB url and DB name (pmsdb)
spring.datasource.url=jdbc:h2:file:~/h2/pmsdb

# DB username
spring.datasource.username=sa

# DB password
spring.datasource.password=

# DB driver
spring.datasource.driverClassName=org.h2.Driver

# Tells to keep existing data and table while server restarts (use 'create' to drop and recreate on restart)
spring.jpa.hibernate.ddl-auto=update

# This enables printing of SQL queries generated by Hibernate in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect